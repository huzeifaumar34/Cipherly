name: Release

# Runs when a version tag such as v0.2.0 is pushed, or manually from the Actions tab
# (Run workflow, with a version such as 0.2.1; the tag is then created by the release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.2.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        env:
          EVENT: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! echo "$VERSION_INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version must look like 0.2.1"
              exit 1
            fi
            TAG="v$VERSION_INPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists. Use a new version number."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Tolerate spaces and line breaks introduced when the secret was pasted.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64. Recreate it with: base64 -w0 cipherly-release.jks"; exit 1; }

      - name: Check keystore and key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E "SHA-?256|Entry type|Certificate fingerprint" \
            || { echo "::error::Could not read the key. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."; exit 1; }

      - name: Test and build signed release
        env:
          CIPHERLY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          CIPHERLY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CIPHERLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CIPHERLY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PversionName="${TAG#v}"
          -PversionCode="${{ github.run_number }}"

      - name: Verify the APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "cipherly-${TAG}.apk"
          sha256sum "cipherly-${TAG}.apk" > "cipherly-${TAG}.apk.sha256"
          FILES=("cipherly-${TAG}.apk" "cipherly-${TAG}.apk.sha256")
          # The release may already exist (created from the GitHub web UI); then just attach the files.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" \
              --title "Cipherly ${TAG}" --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
